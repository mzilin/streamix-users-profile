# Spring configuration for CI
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Service discovery configuration for CI
eureka:
  client:
    fetchRegistry: false
    registerWithEureka: false

# AWS configuration for CI
aws:
  access-key: dummy-key
  secret-key: dummy-secret
  s3:
    region: dummy-region
    avatar-bucket-name: dummy-bucket

# Messaging configuration for CI
kafka:
  topics:
    user-registered: : dummy-topic
  groups:
    profile-registration: dummy-group

rabbitmq:
  queues:
    profile-setup: dummy-queue
    delete-user-data: dummy-queue

# Observability configuration for CI
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
