# Spring configuration for CI
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.add.type.headers]": false

# Service discovery configuration for CI
eureka:
  client:
    fetchRegistry: false
    registerWithEureka: false

# AWS configuration for CI
aws:
  access-key: dummy-key
  secret-key: dummy-secret
  s3:
    region: dummy-region
    avatar-bucket-name: dummy-bucket

# Messaging configuration for CI
kafka:
  topics:
    user-registered:
      name: dummy-topic
      dlt:
        name: dummy-topic-dlt
        partitions: 1
        replication-factor: 1
        retention: 1d
  consumer:
    auto-offset-reset: earliest
    groups:
      profile-registration: dummy-group

rabbitmq:
  exchange: dummy-exchange
  queues:
    profile-setup: dummy-queue
    delete-user-data: dummy-queue
  routing-keys:
    profile-setup: dummy-key
    delete-user-data: dummy-key

# Observability configuration for CI
management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
