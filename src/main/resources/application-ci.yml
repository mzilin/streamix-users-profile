# CI application and infrastructure configuration
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  kafka:
    listener:
      auto-startup: false

# CI service discovery configuration
eureka:
  client:
    fetch-registry: false
    register-with-eureka: false

# AWS configuration for CI
aws:
  access-key: dummy-key
  secret-key: dummy-secret

# CI observability configuration
management:
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false