# Server configuration
server:
  port: 8111

# Application metadata
info:
  app:
    environment: ${spring.profiles.active:default}
    name: ${spring.application.name}
    description: Streamix Profile Service

# Spring application and infrastructure configuration
spring:
  application:
    name: users-profile
  config:
    import:
      - optional:configserver:discovery://config-server
  datasource:
    url: jdbc:postgresql://localhost:5433/streamixdb
    driver-class-name: org.postgresql.Driver
    username: streamix
    password: streamix
  flyway:
    enabled: true
    schemas:
      - streamix_profile
    default-schema: streamix_profile
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    encoding: UTF-8
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: streamix_profile
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JsonDeserializer
        "[spring.json.trusted.packages]": "com.mariuszilinskas.streamix.*"
        "[spring.json.value.default.type]": "com.mariuszilinskas.streamix.users.profile.event.UserDeletedEvent"
 
# AWS configuration
aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  s3:
    region: eu-west-2
    avatar-bucket-name: streamix-user-avatars-dev

# Service discovery configuration
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

# Messaging configuration
kafka:
  topics:
    user-deleted: streamix.user.deleted
  groups:
    user-deletion: streamix-users-profile-user-deletion

# Actuator and observability configuration
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: info, health, prometheus
  endpoint:
    health:
      show-details: when-authorized
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    resource-attributes:
      service.namespace: streamix
      deployment.environment: ${spring.profiles.active:default}
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  tracing:
    sampling:
      probability: 1.0

# Application logging configuration
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    com.mariuszilinskas.streamix: INFO