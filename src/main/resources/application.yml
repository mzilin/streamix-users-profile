# Application metadata
info:
  app:
    environment: ${spring.profiles.active}
    name: ${spring.application.name}
    description: Streamix Profile Service

# Spring application and infrastructure configuration
spring:
  application:
    name: users-profile
  config:
    import:
      - optional:configserver:discovery://config-server
  datasource:
    url: jdbc:postgresql://localhost:5433/streamixdb
    driver-class-name: org.postgresql.Driver
    username: streamix
    password: streamix
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: streamix_profile
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.add.type.headers]": false
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JsonDeserializer
        "[spring.json.trusted.packages]": "com.mariuszilinskas.streamix.*"
        "[spring.json.value.default.type]": "com.mariuszilinskas.streamix.users.profile.event.UserRegisteredEvent"
  rabbitmq:
    host: localhost
    port: 5672
    username: streamix
    password: streamix
 
# AWS configuration
aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  s3:
    region: eu-west-2
    avatar-bucket-name: streamix-user-avatars-dev

# Service discovery configuration
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

# Messaging configuration
kafka:
  topics:
    user-registered: streamix.user.registered
  groups:
    profile-registration: streamix-users-profile-registration

rabbitmq:
  queues:
    profile-setup: profile-setup
    delete-user-data: delete-user-data

# Actuator and observability configuration
management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: info, health, prometheus
  endpoint:
    health:
      show-details: when-authorized
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.namespace: streamix
      deployment.environment: ${spring.profiles.active}
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics

# Application logging configuration
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    com.mariuszilinskas.streamix: INFO